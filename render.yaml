services:
  # ── KrishiScan Backend AI Service (FastAPI) ──
  - type: web
    name: krishiscan-api
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"

  # ── KrishiScan Frontend (React + Vite SPA) ──
  - type: web
    name: krishiscan-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: krishiscan-api
          property: hostURL
