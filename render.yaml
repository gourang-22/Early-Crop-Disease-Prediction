services:
  # ── KrishiScan Backend AI Service (FastAPI) ──
  - type: web
    name: krishiscan-api
    runtime: python
    rootDir: ai-service
    plan: free
    pythonVersion: "3.11.7"
    buildCommand: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"

