spring.application.name=krishiscan-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/krishiscan}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:krishiuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:krishipass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET:dev-secret-change-in-production}
jwt.expiration=86400000

ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

server.port=8080